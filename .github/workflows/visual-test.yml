name: Visual test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual test
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_CI_USER: ${{ secrets.METABASE_CI_USER }}
          METABASE_CI_PASSWORD: ${{ secrets.METABASE_CI_PASSWORD }}
          METABASE_DATABASE_ID: ${{ secrets.METABASE_DATABASE_ID }}
          METABASE_SCHEMA_TRIPS: ${{ secrets.METABASE_SCHEMA_TRIPS }}
          METABASE_SCHEMA_BOROUGH: ${{ secrets.METABASE_SCHEMA_BOROUGH }}
        run: npx playwright test
